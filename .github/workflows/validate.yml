name: validate

on:
  push:
  pull_request:

jobs:
  selftest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/app-preview-craft
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: skills/app-preview-craft/package-lock.json
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: node scripts/doctor.mjs
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      - run: node scripts/selftest.mjs --quick
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
