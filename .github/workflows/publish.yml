name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# The Agent Skills spec wants the skill in a folder named after it, so it lives at
# skills/app-preview-craft/. Agents other than the Claude Code plugin install by cloning
# a folder whose root IS the skill, so every tag republishes that subtree as the
# `skill` branch:
#
#   git clone --depth 1 -b skill <repo> ~/.agents/skills/app-preview-craft
jobs:
  split:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: verify the tag matches the manifests
        run: |
          tag="${GITHUB_REF_NAME#v}"
          plugin=$(node -p "require('./.claude-plugin/plugin.json').version")
          pkg=$(node -p "require('./skills/app-preview-craft/package.json').version")
          skill=$(sed -n 's/^  version: "\(.*\)"$/\1/p' skills/app-preview-craft/SKILL.md)
          echo "tag=$tag plugin.json=$plugin package.json=$pkg SKILL.md=$skill"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            test "$tag" = "$plugin" || { echo "::error::tag $tag != plugin.json $plugin"; exit 1; }
            test "$tag" = "$pkg"    || { echo "::error::tag $tag != package.json $pkg"; exit 1; }
            test "$tag" = "$skill"  || { echo "::error::tag $tag != SKILL.md $skill"; exit 1; }
          fi

      - name: split skills/app-preview-craft onto the skill branch
        run: |
          git subtree split --prefix=skills/app-preview-craft --branch skill
          # No --force: a rejected push means history was rewritten, which would
          # break `git pull --ff-only` for everyone who installed from this branch.
          git push origin skill
