<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tempo sample screens</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/fonts/@fontsource-variable/inter/index.css">
<style>
  :root { --bg:#0b0b0f; --card:#16161d; --card2:#1d1d26; --ink:#f4f4f7; --dim:#8b8b99; --line:#262631;
    --lime:#c6ff3d; --cyan:#36d6ff; --pink:#ff4f8b; --orange:#ff8a3d; --violet:#8b7bff; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font-family:'Inter Variable', system-ui, sans-serif; -webkit-font-smoothing:antialiased; }
  .screen { width:402px; height:874px; position:relative; overflow:hidden; padding:0 18px 110px; }
  .screen.tall { height:auto; }
  .status { height:54px; display:flex; align-items:center; justify-content:space-between; padding:14px 14px 0 26px; font-weight:600; font-size:16px; }
  .status .icons { display:flex; gap:6px; align-items:center; }
  .bar { display:inline-block; width:3px; background:var(--ink); border-radius:1px; margin-right:1.5px; }
  .batt { width:25px; height:12px; border:1.5px solid rgba(255,255,255,.5); border-radius:4px; padding:1.5px; position:relative; }
  .batt i { display:block; height:100%; width:80%; background:var(--ink); border-radius:1.5px; }
  h1 { font-size:32px; letter-spacing:-.03em; margin:10px 0 2px; font-weight:750; }
  h2 { font-size:19px; letter-spacing:-.02em; margin:24px 0 10px; font-weight:700; display:flex; justify-content:space-between; align-items:baseline; }
  h2 small { font-size:14px; color:var(--lime); font-weight:600; }
  .sub { color:var(--dim); font-size:15px; }
  .row { display:flex; gap:10px; }
  .card { background:var(--card); border-radius:22px; padding:16px; border:1px solid var(--line); }
  .pill { display:inline-flex; align-items:center; gap:6px; padding:6px 11px; border-radius:99px; background:var(--card2); font-size:13px; font-weight:600; color:var(--dim); }
  .pill.on { background:var(--lime); color:#111; }
  .big { font-size:30px; font-weight:750; letter-spacing:-.03em; }
  .label { font-size:12px; color:var(--dim); text-transform:uppercase; letter-spacing:.08em; font-weight:600; }
  .tabbar { position:absolute; left:0; right:0; bottom:0; height:92px; background:rgba(11,11,15,.92); border-top:1px solid var(--line); display:flex; justify-content:space-around; padding-top:12px; }
  .tab { display:flex; flex-direction:column; align-items:center; gap:4px; font-size:11px; color:var(--dim); font-weight:600; }
  .tab.on { color:var(--lime); }
  .tab svg { width:26px; height:26px; }
  .home { position:absolute; bottom:8px; left:50%; width:136px; height:5px; margin-left:-68px; border-radius:3px; background:var(--ink); }
  .avatar { width:40px; height:40px; border-radius:50%; display:grid; place-items:center; font-weight:700; font-size:15px; color:#111; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .spark { height:36px; }
  .hidden { display:none !important; }
  .list-item { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); }
  .list-item:last-child { border-bottom:0; }
  .ico { width:42px; height:42px; border-radius:13px; display:grid; place-items:center; flex:none; }
  .grow { flex:1; min-width:0; }
  .t1 { font-weight:650; font-size:15.5px; }
  .t2 { color:var(--dim); font-size:13px; margin-top:2px; }
  .chev { color:var(--dim); font-size:20px; }
  .map { border-radius:22px; overflow:hidden; position:relative; background:#12141c; }
  .desk { width:1512px; height:982px; display:grid; grid-template-columns:240px 1fr; background:var(--bg); }
</style>
</head>
<body>
<script>
const Q = new URLSearchParams(location.search)
const S = Q.get('s') ?? '1'
const icon = {
  home: '<path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z" fill="currentColor"/>',
  run: '<circle cx="14" cy="4.5" r="2.2" fill="currentColor"/><path d="M9 21l2.5-6 3 2.5V22M7 12l3-4 4 1 3 4 3 .5M11.5 15 9 11" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>',
  chart: '<path d="M4 20V11h3v9zm6.5 0V4h3v16zM17 20v-6h3v6z" fill="currentColor"/>',
  plan: '<rect x="3.5" y="5" width="17" height="15" rx="3" stroke="currentColor" stroke-width="2" fill="none"/><path d="M3.5 10h17M8 3v4M16 3v4" stroke="currentColor" stroke-width="2"/>',
  me: '<circle cx="12" cy="8" r="4" fill="currentColor"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z" fill="currentColor"/>',
  bolt: '<path d="M13 2 4 14h7l-1 8 9-12h-7z" fill="currentColor"/>',
  heart: '<path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.9 4.5c2.1 0 3.6 1.1 5.1 3 1.5-1.9 3-3 5.1-3 3.9 0 6 3.9 4.5 7.3C19.5 16.4 12 21 12 21z" fill="currentColor"/>',
  flame: '<path d="M12 22c-4.4 0-7.5-3-7.5-7.2 0-3.8 2.6-6 3.8-9.8 2.2 1.6 3 3.6 3 5.4 1-1 1.7-2.5 1.7-4.4 3.3 2.2 5.5 5.3 5.5 8.8 0 4.2-2.9 7.2-6.5 7.2z" fill="currentColor"/>',
  bike: '<circle cx="6" cy="16" r="4" stroke="currentColor" stroke-width="2" fill="none"/><circle cx="18" cy="16" r="4" stroke="currentColor" stroke-width="2" fill="none"/><path d="M6 16l4-8h5l3 8M10 8l3 8" stroke="currentColor" stroke-width="2" fill="none"/>',
  yoga: '<circle cx="12" cy="4.5" r="2.2" fill="currentColor"/><path d="M4 12c3 0 5-2 8-2s5 2 8 2M12 10v5l-4 6M12 15l4 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>',
  trophy: '<path d="M7 3h10v3h3v2a5 5 0 0 1-5 5 5 5 0 0 1-2 2.6V18h3v3H8v-3h3v-2.4A5 5 0 0 1 9 13a5 5 0 0 1-5-5V6h3z" fill="currentColor"/>',
  pin: '<path d="M12 22s-7-7.2-7-12.5a7 7 0 0 1 14 0C19 14.8 12 22 12 22zm0-9.5a3 3 0 1 0 0-6 3 3 0 0 0 0 6z" fill="currentColor"/>',
}
const svg = (name, size = 22, color = 'currentColor') => `<svg viewBox="0 0 24 24" width="${size}" height="${size}" style="color:${color}">${icon[name]}</svg>`
const status = () => `<div class="status"><span>9:41</span><span class="icons"><span><i class="bar" style="height:5px"></i><i class="bar" style="height:7px"></i><i class="bar" style="height:9px"></i><i class="bar" style="height:11px"></i></span><svg width="17" height="12" viewBox="0 0 17 12"><path d="M8.5 11.5 5.8 8.6a3.8 3.8 0 0 1 5.4 0zM3.4 6.3a7.2 7.2 0 0 1 10.2 0l-1.3 1.3a5.4 5.4 0 0 0-7.6 0zM1 3.8a10.6 10.6 0 0 1 15 0l-1.3 1.3a8.8 8.8 0 0 0-12.4 0z" fill="#fff"/></svg><span class="batt"><i></i></span></span></div>`
const tabs = (on) => `<div class="tabbar">${[['home','Today'],['run','Record'],['chart','Insights'],['plan','Plan'],['me','You']].map(([i,l]) => `<div class="tab ${i===on?'on':''}">${svg(i,26)}${l}</div>`).join('')}<div class="home"></div></div>`

function ring(r, pct, color, w = 14) {
  const c = 2 * Math.PI * r
  return `<circle r="${r}" cx="90" cy="90" fill="none" stroke="${color}" stroke-opacity=".18" stroke-width="${w}"/><circle r="${r}" cx="90" cy="90" fill="none" stroke="${color}" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="${c * pct} ${c}" transform="rotate(-90 90 90)"/>`
}
function sparkline(points, color, h = 36, w = 150) {
  const max = Math.max(...points), min = Math.min(...points)
  const d = points.map((p, i) => `${i ? 'L' : 'M'}${(i / (points.length - 1)) * w} ${h - ((p - min) / (max - min || 1)) * (h - 4) - 2}`).join(' ')
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="100%" preserveAspectRatio="none"><defs><linearGradient id="g${color.slice(1)}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".35"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><path d="${d} L${w} ${h} L0 ${h}Z" fill="url(#g${color.slice(1)})"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round"/></svg>`
}
function mapSvg(w, h, progress = 1) {
  const streets = Array.from({ length: 14 }, (_, i) => `<path d="M${-20 + i * 40} ${-10} L${i * 40 + 60} ${h + 10}" stroke="#1f2230" stroke-width="${i % 4 ? 3 : 7}"/>`).join('') +
    Array.from({ length: 12 }, (_, i) => `<path d="M-10 ${i * 45} L${w + 10} ${i * 45 - 60}" stroke="#1f2230" stroke-width="${i % 3 ? 3 : 6}"/>`).join('')
  const route = 'M40 ' + (h - 40) + ' C 90 ' + (h - 150) + ', 60 120, 150 110 S 260 40, 300 120 S 250 ' + (h - 60) + ', 330 ' + (h - 50)
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" style="display:block"><rect width="${w}" height="${h}" fill="#12141c"/><path d="M${w*0.55} 0 Q ${w*0.7} ${h*0.4} ${w} ${h*0.35} L${w} 0Z" fill="#132a22"/><circle cx="${w*0.2}" cy="${h*0.25}" r="${h*0.16}" fill="#10243a"/>${streets}
    <defs><linearGradient id="rt" x1="0" x2="1"><stop offset="0" stop-color="#c6ff3d"/><stop offset=".5" stop-color="#36d6ff"/><stop offset="1" stop-color="#ff4f8b"/></linearGradient></defs>
    <path d="${route}" fill="none" stroke="#000" stroke-opacity=".5" stroke-width="11" stroke-linecap="round"/>
    <path d="${route}" fill="none" stroke="url(#rt)" stroke-width="6" stroke-linecap="round" pathLength="1" stroke-dasharray="${progress} 1"/>
    <circle cx="40" cy="${h - 40}" r="8" fill="#c6ff3d" stroke="#0b0b0f" stroke-width="3"/></svg>`
}
const bars = (vals, color, hi = -1, h = 120) => `<div style="display:flex;align-items:flex-end;gap:8px;height:${h}px">${vals.map((v, i) => `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:100%;height:${v * (h - 22)}px;border-radius:8px;background:${i === hi ? color : color + '44'}"></div><div style="font-size:11px;color:var(--dim);font-weight:600">${'MTWTFSS'[i % 7]}</div></div>`).join('')}</div>`

const screens = {
  '1': (p = 1) => `${status()}
    <div class="row" style="justify-content:space-between;align-items:center;margin-top:6px">
      <div><div class="sub">Thursday, 17 Sep</div><h1>Good morning, Sam</h1></div>
      <div class="avatar" style="background:linear-gradient(135deg,#c6ff3d,#36d6ff)">S</div>
    </div>
    <div class="card" style="margin-top:16px;display:flex;align-items:center;gap:16px">
      <svg width="150" height="150" viewBox="0 0 180 180">${ring(78, 0.82 * p, '#c6ff3d', 16)}${ring(58, 0.64 * p, '#36d6ff', 16)}${ring(38, 0.91 * p, '#ff4f8b', 16)}</svg>
      <div style="display:flex;flex-direction:column;gap:12px">
        <div><div class="label" style="color:#c6ff3d">Move</div><div style="font-size:22px;font-weight:750">${Math.round(612 * p)}<span class="sub">/750 kcal</span></div></div>
        <div><div class="label" style="color:#36d6ff">Run</div><div style="font-size:22px;font-weight:750">${(6.4 * p).toFixed(1)}<span class="sub">/10 km</span></div></div>
        <div><div class="label" style="color:#ff4f8b">Recover</div><div style="font-size:22px;font-weight:750">${Math.round(91 * p)}<span class="sub">%</span></div></div>
      </div>
    </div>
    <div class="grid2" style="margin-top:10px">
      <div class="card"><div class="label">Steps</div><div class="big">${Math.round(9412 * p).toLocaleString('en')}</div>${sparkline([3, 5, 4, 7, 6, 8, 7, 9, 11], '#c6ff3d')}</div>
      <div class="card"><div class="label">Resting HR</div><div class="big">52 <span class="sub">bpm</span></div>${sparkline([60, 58, 59, 56, 55, 54, 55, 53, 52], '#ff4f8b')}</div>
    </div>
    <h2>Latest run <small>See all</small></h2>
    <div class="card" style="padding:0;overflow:hidden">
      <div class="map" style="border-radius:0">${mapSvg(366, 150, p)}</div>
      <div style="padding:14px 16px;display:flex;justify-content:space-between;align-items:center">
        <div><div class="t1">Riverside tempo</div><div class="t2">6:42 AM · Brooklyn</div></div>
        <div style="text-align:right"><div style="font-weight:750;font-size:20px">8.21 km</div><div class="t2">4:52 /km</div></div>
      </div>
    </div>
    <div class="card" style="margin-top:10px;display:flex;align-items:center;gap:12px;background:linear-gradient(120deg,#23260f,#16161d)">
      <div class="ico" style="background:#c6ff3d;color:#111">${svg('flame', 24)}</div>
      <div class="grow"><div class="t1">12-day streak</div><div class="t2">Run tomorrow to beat your record</div></div>
    </div>
    ${tabs('home')}`,

  '2': () => `${status()}
    <div class="row" style="justify-content:space-between;align-items:center"><span class="pill">‹ Activities</span><span class="pill on">${svg('bolt', 14)} PR</span></div>
    <h1 style="margin-top:14px">Riverside tempo</h1><div class="sub">Thursday · 6:42 AM · Brooklyn, NY</div>
    <div class="map" style="margin-top:14px">${mapSvg(366, 280)}
      <div style="position:absolute;left:12px;bottom:12px" class="pill on">${svg('pin', 14)} 8.21 km loop</div></div>
    <div class="grid2" style="margin-top:10px">
      ${[['Distance', '8.21', 'km'], ['Avg pace', '4:52', '/km'], ['Moving time', '39:58', ''], ['Elevation', '64', 'm']].map(([l, v, u]) => `<div class="card"><div class="label">${l}</div><div class="big">${v}<span class="sub" style="font-size:15px"> ${u}</span></div></div>`).join('')}
    </div>
    <h2>Splits <small>Fastest: km 7</small></h2>
    <div class="card">${[5.02, 4.58, 4.55, 4.49, 4.51, 4.47, 4.38, 4.44].map((v, i) => `<div style="display:flex;align-items:center;gap:10px;margin:5px 0"><span style="width:18px;color:var(--dim);font-size:13px;font-weight:600">${i + 1}</span><div style="flex:1;height:14px;border-radius:7px;background:#262631"><div style="width:${(1 - (v - 4.2) / 1.1) * 100}%;height:100%;border-radius:7px;background:${i === 6 ? '#c6ff3d' : '#36d6ff'}"></div></div><span style="width:44px;text-align:right;font-weight:650;font-size:14px">${String(v).replace('.', ':')}</span></div>`).join('')}</div>
    ${tabs('run')}`,

  '3': () => `${status()}
    <h1>Insights</h1><div class="sub">Your training this week</div>
    <div class="row" style="margin-top:14px"><span class="pill on">Week</span><span class="pill">Month</span><span class="pill">Year</span></div>
    <div class="card" style="margin-top:12px">
      <div class="row" style="justify-content:space-between"><div><div class="label">Distance</div><div class="big">42.7 km</div></div><div class="pill" style="color:#c6ff3d;height:30px">▲ 18%</div></div>
      <div style="margin-top:12px">${bars([0.4, 0.62, 0.3, 0.85, 0.5, 1, 0.7], '#c6ff3d', 5, 150)}</div>
    </div>
    <div class="card" style="margin-top:10px">
      <div class="label">Heart-rate zones</div>
      ${[['Z5 Max', 6, '#ff4f8b'], ['Z4 Threshold', 22, '#ff8a3d'], ['Z3 Tempo', 38, '#c6ff3d'], ['Z2 Easy', 26, '#36d6ff'], ['Z1 Recovery', 8, '#8b7bff']].map(([l, v, c]) => `<div style="display:flex;align-items:center;gap:10px;margin-top:10px"><span style="width:96px;font-size:13px;font-weight:600">${l}</span><div style="flex:1;height:10px;border-radius:5px;background:#262631"><div style="width:${v * 2.4}%;height:100%;border-radius:5px;background:${c}"></div></div><span style="width:34px;text-align:right;font-size:13px;color:var(--dim)">${v}%</span></div>`).join('')}
    </div>
    <div class="grid2" style="margin-top:10px">
      <div class="card"><div class="label">VO₂ max</div><div class="big">54.2</div>${sparkline([49, 50, 50, 51, 52, 52, 53, 54], '#36d6ff')}</div>
      <div class="card"><div class="label">Sleep</div><div class="big">7h 48m</div>${sparkline([6, 7, 6.5, 8, 7.2, 7.8, 8.1, 7.8], '#8b7bff')}</div>
    </div>
    ${tabs('chart')}`,

  '4': () => `${status()}
    <h1>Your plan</h1><div class="sub">Half marathon · 6 weeks to go</div>
    <div class="row" style="margin-top:16px;justify-content:space-between">${['M', 'T', 'W', 'T', 'F', 'S', 'S'].map((d, i) => `<div style="width:44px;padding:9px 0;border-radius:14px;text-align:center;background:${i === 3 ? '#c6ff3d' : 'var(--card)'};color:${i === 3 ? '#111' : 'inherit'};border:1px solid var(--line)"><div style="font-size:11px;font-weight:600;opacity:.7">${d}</div><div style="font-weight:750;font-size:17px">${14 + i}</div><div style="width:6px;height:6px;border-radius:50%;margin:4px auto 0;background:${[1, 0, 1, 1, 0, 1, 1][i] ? (i < 3 ? '#36d6ff' : i === 3 ? '#111' : '#555') : 'transparent'}"></div></div>`).join('')}</div>
    <div class="card" style="margin-top:14px;background:linear-gradient(135deg,#c6ff3d,#7be0a8);color:#111;border:0">
      <div class="label" style="color:#111a">Today · Key session</div>
      <div style="font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:4px">5 × 1 km at tempo</div>
      <div style="margin-top:4px;font-weight:550">Target 4:40/km · 2 min jog recovery</div>
      <div style="margin-top:12px;display:inline-flex;gap:8px;align-items:center;background:#111;color:#c6ff3d;padding:10px 16px;border-radius:99px;font-weight:700">${svg('run', 18)} Start workout</div>
    </div>
    <h2>This week <small>4 of 6 done</small></h2>
    <div class="card" style="padding:4px 16px">
      ${[['run', '#36d6ff', 'Easy run', '6 km · Zone 2', '✓'], ['yoga', '#8b7bff', 'Mobility flow', '20 min', '✓'], ['bike', '#ff8a3d', 'Cross-training ride', '45 min', '✓'], ['run', '#c6ff3d', 'Tempo intervals', 'Today', '›'], ['heart', '#ff4f8b', 'Recovery', 'Rest day', '›'], ['run', '#36d6ff', 'Long run', '18 km', '›']].map(([i, c, t, s, e]) => `<div class="list-item"><div class="ico" style="background:${c}22;color:${c}">${svg(i, 22)}</div><div class="grow"><div class="t1">${t}</div><div class="t2">${s}</div></div><div class="chev" style="color:${e === '✓' ? '#c6ff3d' : ''}">${e}</div></div>`).join('')}
    </div>
    ${tabs('plan')}`,

  '5': () => `${status()}
    <div style="text-align:center;margin-top:10px">
      <div class="avatar" style="width:88px;height:88px;margin:0 auto;font-size:34px;background:linear-gradient(135deg,#c6ff3d,#36d6ff)">S</div>
      <h1 style="font-size:26px">Sam Rivera</h1><div class="sub">Brooklyn Run Club · Level 14</div>
    </div>
    <div class="row" style="margin-top:14px">${[['1,284', 'km this year'], ['146', 'runs'], ['12', 'day streak']].map(([v, l]) => `<div class="card" style="flex:1;text-align:center;padding:12px 6px"><div style="font-weight:800;font-size:22px">${v}</div><div class="t2">${l}</div></div>`).join('')}</div>
    <h2>Badges <small>18 earned</small></h2>
    <div class="row" style="justify-content:space-between">${[['trophy', '#ffd23f'], ['flame', '#ff8a3d'], ['bolt', '#c6ff3d'], ['heart', '#ff4f8b'], ['run', '#36d6ff']].map(([i, c]) => `<div style="width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 30% 30%,${c}55,${c}18);border:2px solid ${c};color:${c}">${svg(i, 28)}</div>`).join('')}</div>
    <h2>Club leaderboard <small>This week</small></h2>
    <div class="card" style="padding:4px 16px">
      ${[['Priya N.', '51.3 km', '#ff4f8b'], ['Sam R. (you)', '42.7 km', '#c6ff3d'], ['Diego M.', '40.1 km', '#36d6ff'], ['Hana K.', '37.9 km', '#8b7bff'], ['Luca B.', '33.0 km', '#ff8a3d']].map(([n, d, c], i) => `<div class="list-item"><span style="width:18px;font-weight:700;color:var(--dim)">${i + 1}</span><div class="avatar" style="background:${c}">${n[0]}</div><div class="grow t1" style="${i === 1 ? 'color:#c6ff3d' : ''}">${n}</div><div style="font-weight:700">${d}</div></div>`).join('')}
    </div>
    ${tabs('me')}`,

  tall: () => `${status()}
    <h1>Journal</h1><div class="sub">Every run, every note</div>
    ${Array.from({ length: 12 }, (_, i) => `<div class="card" style="margin-top:12px;padding:0;overflow:hidden">
      ${i % 3 === 0 ? `<div class="map" style="border-radius:0">${mapSvg(366, 120)}</div>` : ''}
      <div style="padding:14px 16px">
        <div class="row" style="justify-content:space-between"><div class="t1">${['Riverside tempo', 'Bridge loop', 'Park intervals', 'Sunday long run', 'Recovery jog', 'Hill repeats'][i % 6]}</div><div class="t2">${17 - i} Sep</div></div>
        <div class="row" style="margin-top:10px;gap:18px">${[['km', (5 + ((i * 37) % 13)).toFixed(1)], ['/km', `4:${String(38 + ((i * 7) % 20)).padStart(2, '0')}`], ['bpm', 140 + ((i * 11) % 30)]].map(([u, v]) => `<div><span style="font-weight:750;font-size:19px">${v}</span> <span class="t2">${u}</span></div>`).join('')}</div>
        ${sparkline(Array.from({ length: 12 }, (_, k) => Math.sin(k * 0.8 + i) + k * 0.1), ['#c6ff3d', '#36d6ff', '#ff4f8b'][i % 3], 30)}
        <div class="t2" style="margin-top:6px">${['Felt strong on the last 2 km.', 'Windy on the bridge, held pace.', 'New PR on the 400s!', 'Easy and conversational.', 'Legs heavy, kept it short.', 'Six hills, no walking.'][i % 6]}</div>
      </div></div>`).join('')}
    <div style="height:30px"></div>`,

  desk: () => `<div class="desk">
    <div style="border-right:1px solid var(--line);padding:26px 18px">
      <div style="display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px"><div class="ico" style="width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#c6ff3d,#36d6ff);color:#111">${svg('run', 20)}</div>Tempo</div>
      <div style="margin-top:28px;display:flex;flex-direction:column;gap:4px">${[['home', 'Overview', 1], ['run', 'Activities'], ['chart', 'Insights'], ['plan', 'Training plan'], ['trophy', 'Challenges'], ['me', 'Club']].map(([i, l, on]) => `<div style="display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;font-weight:600;${on ? 'background:var(--card2);color:#c6ff3d' : 'color:var(--dim)'}">${svg(i, 20)}${l}</div>`).join('')}</div>
    </div>
    <div style="padding:26px 30px;display:grid;grid-template-columns:1.5fr 1fr;gap:16px;align-content:start">
      <div style="grid-column:1/3;display:flex;justify-content:space-between;align-items:center"><div><div class="sub">Week 38</div><h1 style="margin:2px 0">Training overview</h1></div><div class="row"><span class="pill on">This week</span><span class="pill">Month</span><span class="pill">Year</span></div></div>
      <div class="card"><div class="row" style="justify-content:space-between"><div><div class="label">Distance</div><div class="big">42.7 km</div></div><div class="pill" style="color:#c6ff3d;height:30px">▲ 18%</div></div><div style="margin-top:14px">${bars([0.4, 0.62, 0.3, 0.85, 0.5, 1, 0.7], '#c6ff3d', 5, 210)}</div></div>
      <div class="map">${mapSvg(470, 300)}</div>
      <div class="card" style="grid-column:1/3;display:grid;grid-template-columns:repeat(4,1fr);gap:16px">${[['Avg pace', '4:52 /km', '#36d6ff', [5, 4.9, 5.1, 4.8, 4.9, 4.7, 4.85]], ['Resting HR', '52 bpm', '#ff4f8b', [58, 57, 55, 55, 54, 53, 52]], ['VO₂ max', '54.2', '#8b7bff', [50, 51, 51, 52, 53, 53, 54]], ['Sleep', '7h 48m', '#c6ff3d', [6, 7, 6.5, 8, 7.2, 7.8, 8]]].map(([l, v, c, pts]) => `<div><div class="label">${l}</div><div style="font-size:24px;font-weight:750">${v}</div>${sparkline(pts, c, 50)}</div>`).join('')}</div>
      <div class="card" style="grid-column:1/3;padding:6px 18px">
        <div style="display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;padding:10px 0;border-bottom:1px solid var(--line)" class="label"><span>Recent activity</span><span>Distance</span><span>Pace</span><span>Heart rate</span><span>Effort</span></div>
        ${[['run', '#36d6ff', 'Riverside tempo', 'Today · 6:42 AM', '8.21 km', '4:52 /km', '156 bpm', 0.8], ['bike', '#ff8a3d', 'Cross-training ride', 'Tue · 7:10 PM', '24.6 km', '2:26 /km', '138 bpm', 0.55], ['run', '#c6ff3d', 'Park intervals', 'Mon · 6:30 AM', '6.40 km', '4:31 /km', '164 bpm', 0.92], ['yoga', '#8b7bff', 'Mobility flow', 'Sun · 9:00 AM', '—', '—', '96 bpm', 0.25]].map(([i, c, t, s, d, p, h, e]) => `<div style="display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)"><div style="display:flex;gap:12px;align-items:center"><div class="ico" style="width:38px;height:38px;background:${c}22;color:${c}">${svg(i, 20)}</div><div><div class="t1">${t}</div><div class="t2">${s}</div></div></div><span style="font-weight:650">${d}</span><span style="font-weight:650">${p}</span><span style="font-weight:650">${h}</span><div style="height:8px;border-radius:4px;background:#262631;margin-right:10px"><div style="width:${e * 100}%;height:100%;border-radius:4px;background:${c}"></div></div></div>`).join('')}
      </div>
    </div></div>`,
}

const wrap = document.createElement('div')
if (S === 'desk') document.body.innerHTML = screens.desk()
else {
  wrap.className = S === 'tall' ? 'screen tall' : 'screen'
  wrap.innerHTML = S === 'rec' ? screens['1'](0) : screens[S]()
  document.body.append(wrap)
}
// Recording mode: window.seek(t) animates the Today screen filling in.
window.seek = (t) => {
  const p = Math.min(1, Math.max(0, (t - 0.3) / 2.2))
  const e = 1 - (1 - p) ** 3
  wrap.innerHTML = screens['1'](e)
  wrap.scrollTop = 0
  document.documentElement.scrollTop = 0
}
document.fonts.ready.then(() => { window.ready = true })
</script>
</body>
</html>
